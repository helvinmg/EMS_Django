{% extends 'base.html' %}
{% load static %}
{% block title %} Employee List {% endblock %}
{% block content %}
    <h2>Employee Table</h2>
    <table border=1>
        <tr><th>Name</th><th>Desg</th><th>Salary</th></tr>
        {% for emp in emps %}
        <tr><td>{{emp.name}}</td><td>{{emp.desg}}</td><td>{{emp.salary}}</td></tr>
        {% endfor %}
    </table>
{% endblock %}
